<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Status App</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
  margin-bottom: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.status-card {
  background: #ffe4ec;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  width: 45%;
}

.list-item {
  margin: 10px 0;
}
</style>
</head>

<body>

<div>
<button id="loginGoogle" style="background:#db4437;width:100%">
  Войти через Google
</button>

<button id="logoutGoogle" style="background:#555;width:100%;display:none">
  Выйти
</button>

  <!-- МОЙ СТАТУС -->
  <div class="card status-card">
    <h3>Мой статус</h3>
    <p id="me">Загрузка...</p>

    <button style="background:#28a745" onclick="setStatus('Учусь')">Учусь</button>
    <button style="background:#ffc107" onclick="setStatus('Кофе')">Кофе</button><br>
    <button style="background:#17a2b8" onclick="setStatus('В игре')">В игре</button>
    <button style="background:#6c757d" onclick="setStatus('Дома')">Дома</button>
  </div>

  <!-- СПИСОК -->
  <div class="card">
    <h3>Пользователи</h3>
    <div id="list"></div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// 🔴 ВСТАВЬ СВОИ ДАННЫЕ
const URL = 'https://pcqynrythvnyikchappl.supabase.co'
const KEY = 'sb_publishable_1YoIc3WsA1ywCxFfkcpdHg_ZWa5I6eN'
const MY_ID = 'd9eeb7aa-2ded-47c5-86de-98377838ea2c'

const supabase = createClient(URL, KEY)
window.supabase = supabase

// 🔄 смена статуса (БЕЗ COLOR)
window.setStatus = async (text) => {

  const { error } = await supabase
    .from('profiles')
    .update({
      status: text
    })
    .eq('id', MY_ID)

  if (error) {
    alert(error.message)
    console.error(error)
  } else {
    load()
  }
}

// 📥 загрузка пользователей
async function load() {

  const { data, error } = await supabase
    .from('profiles')
    .select('*')

  if (error) {
    console.error(error)
    return
  }

  document.getElementById('list').innerHTML =
    data.map(u => `
      <div class="list-item">
        <b>${u.username}</b><br>
        <small>${u.status || 'нет статуса'}</small>
      </div>
    `).join('')

  const me = data.find(u => u.id === MY_ID)
  if (me) {
    document.getElementById('me').innerText =
      me.username + " — " + me.status
  }
}

load()
setInterval(load, 3000)

// 🔐 LOGIN GOOGLE
document.getElementById("loginGoogle").addEventListener("click", async () => {
  const { data, error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://lausy240116.github.io/PO243/"
    }
  })
})

// 🚪 LOGOUT
document.getElementById("logoutGoogle").addEventListener("click", async () => {
  await supabase.auth.signOut()
  location.reload()
})

// 👤 проверка сессии
async function checkUser() {
  const { data } = await supabase.auth.getUser()

  if (data?.user) {
    document.getElementById("loginGoogle").style.display = "none"
    document.getElementById("logoutGoogle").style.display = "block"
  }
}

checkUser()

// =====================================================
// ✅ ДОБАВЛЕННЫЙ ФУНКЦИОНАЛ (ОНЛАЙН + УЧЁБА)
// =====================================================

let studySeconds = 0
let studyTimer = null
let lastStatus = null

const timerEl = document.createElement("div")
timerEl.style.marginTop = "10px"
timerEl.style.fontWeight = "bold"
document.querySelector(".status-card").appendChild(timerEl)

const onlineEl = document.createElement("div")
onlineEl.style.marginTop = "10px"
onlineEl.style.fontSize = "14px"
document.querySelector(".status-card").appendChild(onlineEl)

// формат времени
function format(sec) {
  const h = Math.floor(sec / 3600)
  const m = Math.floor((sec % 3600) / 60)
  const s = sec % 60
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`
}

// получить мой профиль
async function getMeProfile() {
  const { data } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', MY_ID)
    .single()

  return data
}

// главный цикл
async function trackerLoop() {
  const me = await getMeProfile()
  if (!me) return

  // онлайн статус
  onlineEl.textContent = me.is_online ? "🟢 Онлайн" : "🔴 Оффлайн"

  // если статус изменился
  if (me.status !== lastStatus) {
    lastStatus = me.status

    if (me.status === "Учусь") {
      startTimer()
    } else {
      stopTimer()
    }
  }
}

// таймер старт
function startTimer() {
  if (studyTimer) return

  studyTimer = setInterval(async () => {
    studySeconds++

    timerEl.textContent = "⏱ " + format(studySeconds)

    await supabase
      .from('profiles')
      .update({
        total_study_seconds: studySeconds
      })
      .eq('id', MY_ID)

  }, 1000)
}

// таймер стоп
function stopTimer() {
  clearInterval(studyTimer)
  studyTimer = null
}

// запуск трекера
setInterval(trackerLoop, 3000)

// online/offline
supabase.auth.onAuthStateChange((event, session) => {
  const user = session?.user

  if (user) {
    supabase.from('profiles')
      .update({ is_online: true })
      .eq('id', MY_ID)
  } else {
    supabase.from('profiles')
      .update({ is_online: false })
      .eq('id', MY_ID)
  }
})

// offline при закрытии
window.addEventListener("beforeunload", () => {
  supabase.from('profiles')
    .update({ is_online: false })
    .eq('id', MY_ID)
})

</script>

</body>
</html>
