<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Status App</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f5f7;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 40px;
  margin: 0;
}

.auth-buttons {
  width: 340px;
  margin-bottom: 15px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 20px;
  width: 340px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  box-sizing: border-box;
}

.status-card {
  text-align: center;
}

.user-name {
  font-size: 20px;
  font-weight: bold;
  color: #111;
  margin-bottom: 15px;
}

.timer-display {
  font-size: 28px;
  font-weight: bold;
  color: #2b77f3;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

button {
  padding: 12px;
  margin: 5px 0;
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.9;
}

.btn-stop { background: #dc3545; }
.btn-break { background: #ffc107; color: #111; }
.btn-logout { background: #6c757d; }

.btn-group {
  display: flex;
  gap: 10px;
}
.btn-group button {
  width: 50%;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 0;
  margin-bottom: 20px;
}

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}
.list-item:last-child {
  border-bottom: none;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.online-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ccc; /* По умолчанию серый (оффлайн) */
  display: inline-block;
}
.online-dot.active {
  background: #28a745; /* Зеленый (онлайн) */
}

.user-title {
  font-weight: bold;
  color: #111;
}

.user-status-info {
  text-align: right;
  font-size: 13px;
  color: #666;
}
.status-text {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
}
.time-text {
  color: #2b77f3;
  font-size: 12px;
  margin-top: 2px;
}
</style>
</head>

<body>

<div class="auth-buttons">
  <button id="loginGoogle" style="background:#db4437;">
    Войти через Google
  </button>
  <button id="logoutGoogle" style="background:#555; display:none">
    Выйти
  </button>
</div>

<div class="card status-card">
  <div class="user-name" id="me-name">Загрузка...</div>
  
  <div class="timer-display">
    ⏱️ <span id="me-timer">0 сек.</span>
  </div>

  <button class="btn-stop" onclick="changeStudyState(false)">⛔ Завершить сессию</button>
  
  <div class="btn-group">
    <button class="btn-break" onclick="setStatus('Перерыв')">☕ Перерыв</button>
    <button class="btn-logout" onclick="setStatus('Выход')">Выход</button>
  </div>
</div>

<div class="card">
  <div class="section-title">👥 Монитор группы</div>
  <div id="list"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const URL = 'https://pcqynrythvnyikchappl.supabase.co'
const KEY = 'sb_publishable_1YoIc3WsA1ywCxFfkcpdHg_ZWa5I6eN'
const MY_ID = 'd9eeb7aa-2ded-47c5-86de-98377838ea2c'

const supabase = createClient(URL, KEY)
window.supabase = supabase

let currentMeData = null;

// Функция принудительной установки онлайна при заходе на сайт
async function setOnlineStatus(isOnline) {
  const updates = { is_online: isOnline };
  // Если заходим на сайт, автоматически ставим статус 'Учусь' и засекаем старт, если сессия еще не начата
  if (isOnline) {
    updates.status = 'Учусь';
    updates.study_start = new Date().toISOString();
  }
  
  await supabase
    .from('profiles')
    .update(updates)
    .eq('id', MY_ID);
}

// Смена текстового статуса вручную
window.setStatus = async (text) => {
  const { error } = await supabase
    .from('profiles')
    .update({ status: text })
    .eq('id', MY_ID)

  if (error) { console.error(error) } else { load() }
}

// Ручное завершение сессии кнопкой
window.changeStudyState = async (start) => {
  const updates = { is_online: start };
  
  if (start) {
    updates.study_start = new Date().toISOString();
    updates.status = 'Учусь';
  } else {
    if (currentMeData && currentMeData.study_start) {
      const startSec = Math.floor(new Date(currentMeData.study_start).getTime() / 1000);
      const nowSec = Math.floor(Date.now() / 1000);
      const diff = Math.max(0, nowSec - startSec);
      
      updates.total_study_seconds = (currentMeData.total_study_seconds || 0) + diff;
    }
    updates.study_start = null;
    updates.status = 'Дома';
  }

  const { error } = await supabase
    .from('profiles')
    .update(updates)
    .eq('id', MY_ID)

  if (error) { console.error(error) } else { load() }
}

function formatDuration(totalSeconds) {
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return `${hours}ч ${minutes}м ${seconds}с`;
}

// Загрузка данных
async function load() {
  const { data, error } = await supabase
    .from('profiles')
    .select('*')

  if (error) {
    console.error(error)
    return
  }

  // Рендер списка
  document.getElementById('list').innerHTML = data.map(u => {
    let liveSec = u.total_study_seconds || 0;
    const isUserOnline = u.is_online === true || u.is_online === 'true';

    if (isUserOnline && u.study_start) {
      const diff = Math.floor(Date.now() / 1000) - Math.floor(new Date(u.study_start).getTime() / 1000);
      if (diff > 0) liveSec += diff;
    }

    let statusIcon = '🏠';
    if (u.status === 'Перерыв') statusIcon = '☕';
    if (u.status === 'Учусь') statusIcon = '📝';
    if (u.status === 'Выход') statusIcon = '🚪';

    return `
      <div class="list-item">
        <div class="user-info">
          <div class="online-dot ${isUserOnline ? 'active' : ''}"></div>
          <div class="user-title">${u.username || 'Без имени'}</div>
        </div>
        <div class="user-status-info">
          <div class="status-text">${statusIcon} ${u.status || 'Нет статуса'}</div>
          <div class="time-text">⏱️ ${formatDuration(liveSec)}</div>
        </div>
      </div>
    `;
  }).join('')

  const me = data.find(u => u.id === MY_ID)
  if (me) {
    currentMeData = me;
    document.getElementById('me-name').innerText = me.username || 'Без имени';
  }
}

// Локальный таймер секунд (тикает каждую сек)
setInterval(() => {
  if (currentMeData) {
    let currentSeconds = 0;
    const isMeOnline = currentMeData.is_online === true || currentMeData.is_online === 'true';
    if (isMeOnline && currentMeData.study_start) {
      currentSeconds = Math.floor(Date.now() / 1000) - Math.floor(new Date(currentMeData.study_start).getTime() / 1000);
      if (currentSeconds < 0) currentSeconds = 0;
    }
    document.getElementById('me-timer').innerText = `${currentSeconds} сек.`;
  }
}, 1000);

// Переодический запрос в базу
setInterval(load, 4000)

// Логика авторизации + АВТО-ОНЛАЙН
async function checkUser() {
  const { data } = await supabase.auth.getUser()
  if (data?.user) {
    document.getElementById("loginGoogle").style.display = "none"
    document.getElementById("logoutGoogle").style.display = "block"
    
    // 🟢 ТУТ: Как только зашли на сайт — включаем онлайн и статус «Учусь»
    await setOnlineStatus(true);
    load();
  }
}

// 🔴 Авто-оффлайн при закрытии вкладки / браузера
window.addEventListener('beforeunload', () => {
  // Используем navigator.sendBeacon или обычный быстрый запрос, чтобы успеть убрать онлайн перед закрытием страницы
  const json = JSON.stringify({ is_online: false, status: 'Дома' });
  const blob = new Blob([json], { type: 'application/json' });
  navigator.sendBeacon(`${URL}/rest/v1/profiles?id=eq.${MY_ID}`, blob);
});

// Нажатие на кнопки входа/выхода
document.getElementById("loginGoogle").addEventListener("click", async () => {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: "https://lausy240116.github.io/PO243/" }
  })
})

document.getElementById("logoutGoogle").addEventListener("click", async () => {
  await setOnlineStatus(false); // Сначала выключаем онлайн
  await supabase.auth.signOut()
  location.reload()
})

// Старт
checkUser()
</script>

</body>
</html>
