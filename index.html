<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Status App</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f5f7;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 40px;
  margin: 0;
}

.auth-buttons {
  width: 340px;
  margin-bottom: 15px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 20px;
  width: 340px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  box-sizing: border-box;
}

.status-card {
  text-align: center;
}

.user-name {
  font-size: 20px;
  font-weight: bold;
  color: #111;
  margin-bottom: 10px;
}

.timer-display {
  font-size: 28px;
  font-weight: bold;
  color: #2b77f3;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

button {
  padding: 12px;
  margin: 5px 0;
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.9;
}

.btn-stop { background: #dc3545; }
.btn-start { background: #28a745; }
.btn-break { background: #ffc107; color: #111; }
.btn-logout { background: #6c757d; }

.btn-group {
  display: flex;
  gap: 10px;
}

.btn-group button {
  width: 50%;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  color: #111;
  margin-bottom: 15px;
}

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.online-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ccc;
  display: inline-block;
  margin-right: 8px;
}

.online-dot.active {
  background: #28a745;
}

.time-text {
  color: #2b77f3;
  font-size: 12px;
}

#chat-box {
  height: 300px;
  overflow-y: auto;
  background: #f7f7f7;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #e2e2e2;
}

.chat-message {
  background: white;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.chat-user {
  font-weight: bold;
  margin-bottom: 4px;
  color: #2b77f3;
}

.chat-text {
  word-break: break-word;
}

.achievement {
  background: #f7f7f7;
  border-radius: 10px;
  padding: 8px;
  margin-bottom: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="auth-buttons">
  <button id="loginGoogle" style="background:#db4437;">
    Войти через Google
  </button>

  <button id="logoutGoogle" style="background:#555; display:none">
    Выйти
  </button>
</div>

<div class="card status-card">

  <div class="user-name" id="me-name">Загрузка...</div>

  <div id="my-achievements"></div>

  <div class="timer-display">
    ⏱️ <span id="me-timer">0 сек.</span>
  </div>

  <button id="main-action-btn"
          class="btn-stop"
          onclick="toggleStudySession()">
    ⛔ Завершить сессию
  </button>

  <div class="btn-group">
    <button class="btn-break" onclick="setBreakStatus()">
      ☕ Перерыв
    </button>

    <button class="btn-logout" onclick="setExitStatus()">
      Выход
    </button>
  </div>

</div>

<div class="card">
  <div class="section-title">🏆 Топ студентов</div>
  <div id="top-students"></div>
</div>

<div class="card">
  <div class="section-title">👥 Монитор группы</div>
  <div id="list"></div>
</div>

<div class="card">
  <div class="section-title">💬 Общий чат</div>

  <div id="chat-box"></div>

  <input type="text" id="chat-input"
    placeholder="Введите сообщение..."
    style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;">

  <button class="btn-start" onclick="sendMessage()">
    Отправить
  </button>
</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const URL = 'https://pcqynrythvnyikchappl.supabase.co'
const KEY = 'sb_publishable_1YoIc3WsA1ywCxFfkcpdHg_ZWa5I6eN'
const MY_ID = 'd9eeb7aa-2ded-47c5-86de-98377838ea2c'

const supabase = createClient(URL, KEY)

let currentMeData = null;

/* ===================== FIX TIME ===================== */

function getSessionSeconds() {
  if (!currentMeData?.study_start) return 0;

  return Math.max(
    0,
    Math.floor(Date.now() / 1000) -
    Math.floor(new Date(currentMeData.study_start).getTime() / 1000)
  );
}

function getTotalSeconds() {
  return (currentMeData?.total_study_seconds || 0) + getSessionSeconds();
}

/* ===================== ACHIEVEMENTS FIX ===================== */

function renderAchievements() {

  if (!currentMeData) return;

  const map = {
    early_bird: '🌅 Ранняя пташка',
    marathon: '🔥 Марафонец',
    activist: '💬 Активист',
    first_session: '🎯 Первый шаг'
  };

  let achievements = currentMeData.achievements;

  if (!achievements) achievements = [];
  if (typeof achievements === 'string') {
    try { achievements = JSON.parse(achievements); }
    catch { achievements = []; }
  }
  if (!Array.isArray(achievements)) achievements = [];

  const box = document.getElementById('my-achievements');

  box.innerHTML = achievements.length
    ? achievements.map(a => `<div class="achievement">${map[a] || a}</div>`).join('')
    : `<div class="achievement">Ачивок пока нет</div>`;
}

/* ===================== CORE ===================== */

const sessionSeconds =
  currentMeData.study_start
    ? Math.floor(Date.now() / 1000) -
      Math.floor(new Date(currentMeData.study_start).getTime() / 1000)
    : 0;

const total =
  Number(currentMeData.total_study_seconds || 0) + sessionSeconds;

updates.total_study_seconds = total;
  

  if (!currentMeData) return;

  const isOnline =
    currentMeData.is_online === true ||
    currentMeData.is_online === 'true';

  const isStudying =
    isOnline && currentMeData.status === 'Учусь';

  const updates = {};

  if (isStudying) {

    updates.is_online = false;
    updates.status = 'Дома';
    updates.total_study_seconds = getTotalSeconds();
    updates.study_start = null;

  } else {

    updates.is_online = true;
    updates.status = 'Учусь';
    updates.study_start = new Date().toISOString();

  }

  await supabase.from('profiles')
    .update(updates)
    .eq('id', MY_ID);

  load();
};

/* ===================== TOP FIX ===================== */

function renderTopStudents(data) {

  const sorted = [...data]
    .sort((a,b)=>(b.total_study_seconds||0)-(a.total_study_seconds||0))
    .slice(0,5);

  document.getElementById('top-students').innerHTML =
    sorted.map((u,i)=>`
      <div class="list-item">
        <div>#${i+1} ${u.username}</div>
        <div class="time-text">${formatDuration(u.total_study_seconds||0)}</div>
      </div>
    `).join('');
}

/* ===================== UI TIME ===================== */

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return `${h}ч ${m}м ${s}с`;
}

/* ===================== LOAD ===================== */

async function load() {

  const { data } = await supabase.from('profiles').select('*');

  renderTopStudents(data);

  const me = data.find(u => u.id === MY_ID);

  if (me) {
    currentMeData = me;

    document.getElementById('me-name').innerText = me.username;

    renderAchievements();

    document.getElementById('me-timer').innerText =
      formatDuration(getTotalSeconds());
  }
}

/* ===================== INIT ===================== */

setInterval(load, 4000);
load();

</script>

</body>
</html>
